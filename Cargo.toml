[package]
name = "airelay"
version = "0.2.1"
edition = "2021"
description = "AI Relay — 协议中继，让 Claude Code / Codex 使用任意大模型 API"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
indexmap = { version = "2", features = ["serde"] }
async-stream = "0.3"
tray-icon = "0.24"
tao = "0.35"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
